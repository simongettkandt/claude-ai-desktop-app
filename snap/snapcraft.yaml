name: claude-ai-desktop
# Der Store zeigt title statt name. Der Name bleibt, sonst verliert die Installbasis den
# Update-Pfad; der angezeigte Titel verweist auf Claude statt sich so zu nennen.
title: Desktop for Claude (Unofficial)
version: '1.4.16'
summary: Desktop for Claude, an unofficial Claude AI app with tabs and tray
description: |
  Desktop for Claude is an unofficial app that runs claude.ai on Linux
  without a browser tab, with multi-tab support, system tray, voice input
  and in-app OAuth popups for connectors.

  Not affiliated with Anthropic.

  There is an official Claude app for Linux since 30 June 2026: Ubuntu
  22.04+ and Debian 12+, installed from Anthropic's apt repository, with
  Cowork and Claude Code included. If that fits your system, use it. See
  https://code.claude.com/docs/en/desktop-linux

  This app is not discontinued. Updates and fixes keep coming, new features
  less often than before. It also remains the option on Ubuntu 20.04, which
  the official app does not support, and here in the Snap Store, where there
  is no official package.

  What's new in v1.4.16:

  * A Design window replaces the blind toggles. It shows every colour
    theme as a small preview of the real window and page, and applies
    the choice immediately.
  * New colour theme Midnight Blue: deep blue surfaces with scattered
    wave crests in the background, the counterpart to OLED's stars.
  * New style Neon, a blue accent. Style and colour theme are separate
    now, so every combination is selectable, and the style also sets
    the send arrow, which used to stay orange in every theme.
  * Several colouring leftovers are gone: the ring around the input
    field sat next to its corners, grey bars showed on the Code and
    Design pages, and in the light theme the design page had a black
    lower half.

  Highlights from v1.4.15:

  * Buying a subscription works again. The protection that keeps foreign
    embedded content out of the app rejected claude.ai's own payment
    frames, so only pulsing placeholders were left.
  * In the light theme, artifacts and the Design view no longer show up
    as a colour negative, and the OLED Share button is visible again.

  System requirements:

  Tested on Ubuntu 20.04 (kernel 5.4) and newer, Fedora 32+, and recent
  Arch / Manjaro / openSUSE Tumbleweed. Older kernels (e.g. Ubuntu
  19.10, kernel 5.3) have degraded Snap AppArmor confinement and a
  broken Mesa userspace ABI for ANGLE - the app may fail to render.
  Please upgrade if you see "App is not responding" on launch.

  Core features:

  * Tab system with its own tab bar (Ctrl+T, Ctrl+W, Ctrl+Tab)
  * System tray with optional minimize-to-tray
  * Global Quick-Prompt hotkey - frameless prompt window drops your
    text straight into a new chat from any app
  * Voice input - record voice messages directly in claude.ai
  * OAuth logins in-app - Google, GitHub, Drive, GitLab, Bitbucket,
    Microsoft
  * Markdown export of conversations (Ctrl+Shift+E)
  * Prompt templates for the Quick-Prompt window
  * Background reply notifications when Claude finishes answering
  * Clipboard & screenshot hotkeys to start a chat from selection
  * Four colour themes (Light, Dark, OLED, Midnight Blue) and three
    accent styles (Modern, Classic, Neon), freely combinable
  * Bug report form in DE/EN/FR/ES/IT
  * Auto-update synced with the GitHub Release
  * Window memory, crash recovery, offline page, download manager,
    autostart, sandbox enabled

  Snap permissions:

  For Voice Input the audio-record interface must be connected once:

    sudo snap connect claude-ai-desktop:audio-record

  The in-app wizard guides you through this on first microphone use.

  Get in touch:

  This is an unofficial community wrapper around claude.ai for Linux,
  built by one developer in their spare time. It is not made by,
  endorsed by, or affiliated with Anthropic PBC. "Claude" and the
  Claude logo are trademarks of Anthropic PBC.

  For anything about your account, login, subscription, billing or
  payment, or any problem that also happens on claude.ai in a normal
  browser, only Anthropic can help. This app cannot:
  https://support.anthropic.com

  For bugs in this Linux app itself, use the built-in "Report a Bug"
  button (App Menu -> Report a Bug), or email
  simonlinuxcraft@pm.me. That address reaches the developer, not
  Anthropic support.

  Source code: https://github.com/simonlinuxcraft/claude-ai-desktop-app
  (MIT licence)

base: core24
grade: stable
confinement: strict

platforms:
  amd64:

# Eigener /dev/shm fuer diesen Snap. Ohne teilen sich alle Snaps mit browser-support
# (Chromium, andere Electron-Apps) denselben /dev/shm-Namensraum -> Chromium-Renderer
# koennen dort scheitern ("Creating shared memory in /dev/shm ... failed"), ein bekannter
# Snap-Freeze-Ausloeser. private:true auto-connectet ohne manuellen Store-Review.
plugs:
  shared-memory:
    private: true

apps:
  claude-ai-desktop:
    command: app/electron-launch
    extensions: [gnome]
    autostart: claude-ai-desktop.desktop
    environment:
      # Electron liest CHROME_DESKTOP fuer den desktop-entry-Hint der Notifications;
      # ohne ihn ordnet GNOME Shell sie keiner App zu und filtert sie unter strict confinement
      CHROME_DESKTOP: claude-ai-desktop.desktop
    plugs:
      - browser-support
      - network
      - audio-playback
      - audio-record
      - desktop
      - home
      - removable-media
      - x11
      - wayland
      - gsettings
      - opengl
      - screen-inhibit-control
      - shared-memory

parts:
  electron-app:
    plugin: dump
    source: dist/linux-unpacked
    organize:
      '*': app/
    stage:
      # Chromium-Lizenz-Dump (19 MB) wird im Snap nicht gebraucht, spart ~8 MB komprimiert.
      # Nur Excludes: snapcraft nimmt '*' als Default-Include an.
      - -app/LICENSES.chromium.html
    stage-packages:
      - libnotify4
      - libnss3
      - libxss1
      - libxtst6
      - xdg-utils
      - libdrm2
      - libgbm1
      - libayatana-appindicator3-1

  launcher:
    plugin: dump
    source: snap/local
    organize:
      electron-launch: app/electron-launch
