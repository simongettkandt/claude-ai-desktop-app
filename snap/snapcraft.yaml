name: claude-ai-desktop
version: '1.4.3'
summary: Unofficial desktop wrapper for Claude AI with tabs, tray and voice input
description: |
  Unofficial desktop app for Claude AI on Linux. Runs claude.ai without
  a browser tab, with multi-tab support, system tray, voice input and
  in-app OAuth popups for connectors.

  Not affiliated with Anthropic.

  What's new in v1.4.3:

  * Custom connectors connect in-app again - the sign-in popup for a
    custom connector now opens inside the app instead of the system
    browser, where the callback never returned, so the connection
    completes.
  * File dialogs go through the portal - attaching files and saving
    downloads now use xdg-desktop-portal, so you can reach files
    outside your home folder and on external drives.
  * Updated to the latest Electron 41 with current Chromium security
    fixes.

  Highlights from v1.4.2:

  * Italian and French interface, following your system language, with
    an English fallback.
  * Notifications attribute to the app again on Snap, and a slightly
    smaller download.

  Highlights from v1.4.0:

  * OLED theme as a third theme and a frameless main window with custom
    Minimize, Maximize and Close controls.

  System requirements:

  Tested on Ubuntu 20.04 (kernel 5.4) and newer, Fedora 32+, and recent
  Arch / Manjaro / openSUSE Tumbleweed. Older kernels (e.g. Ubuntu
  19.10, kernel 5.3) have degraded Snap AppArmor confinement and a
  broken Mesa userspace ABI for ANGLE - the app may fail to render.
  Please upgrade if you see "App is not responding" on launch.

  Core features:

  * Tab system with its own tab bar (Ctrl+T, Ctrl+W, Ctrl+Tab)
  * System tray with optional minimize-to-tray
  * Global Quick-Prompt hotkey - frameless prompt window drops your
    text straight into a new chat from any app
  * Voice input - record voice messages directly in claude.ai
  * OAuth logins in-app - Google, GitHub, Drive, GitLab, Bitbucket,
    Microsoft
  * Markdown export of conversations (Ctrl+Shift+E)
  * Prompt templates for the Quick-Prompt window
  * Background reply notifications when Claude finishes answering
  * Clipboard & screenshot hotkeys to start a chat from selection
  * Dark/Light mode plus two design variants (Modern, Classic)
  * Bug report form in DE/EN/FR/ES/IT
  * Auto-update synced with the GitHub Release
  * Window memory, crash recovery, offline page, download manager,
    autostart, sandbox enabled

  Snap permissions:

  For Voice Input the audio-record interface must be connected once:

    sudo snap connect claude-ai-desktop:audio-record

  The in-app wizard guides you through this on first microphone use.

  Get in touch:

  Use the built-in "Report a Bug" button (App Menu -> Report a Bug) for
  feedback and bug reports. Or contact:
  claudeai.desktop.linux@gmail.com

  Source code: https://github.com/simonlinuxcraft/claude-ai-desktop-app
  (MIT licence)

  This is an unofficial community wrapper around claude.ai for Linux.
  It is not made by, endorsed by, or affiliated with Anthropic PBC.
  "Claude" and the Claude logo are trademarks of Anthropic PBC. For
  account, login, subscription, billing or any service-side questions
  please contact Anthropic directly at https://support.anthropic.com.

base: core24
grade: stable
confinement: strict

platforms:
  amd64:

apps:
  claude-ai-desktop:
    command: app/electron-launch
    extensions: [gnome]
    autostart: claude-ai-desktop.desktop
    environment:
      # Electron liest CHROME_DESKTOP fuer den desktop-entry-Hint der Notifications;
      # ohne ihn ordnet GNOME Shell sie keiner App zu und filtert sie unter strict confinement
      CHROME_DESKTOP: claude-ai-desktop.desktop
    plugs:
      - browser-support
      - network
      - audio-playback
      - audio-record
      - desktop
      - home
      - removable-media
      - x11
      - wayland
      - gsettings
      - opengl
      - screen-inhibit-control

parts:
  electron-app:
    plugin: dump
    source: dist/linux-unpacked
    organize:
      '*': app/
    stage:
      # Chromium-Lizenz-Dump (19 MB) wird im Snap nicht gebraucht, spart ~8 MB komprimiert.
      # Nur Excludes: snapcraft nimmt '*' als Default-Include an.
      - -app/LICENSES.chromium.html
    stage-packages:
      - libnotify4
      - libnss3
      - libxss1
      - libxtst6
      - xdg-utils
      - libdrm2
      - libgbm1
      - libayatana-appindicator3-1

  launcher:
    plugin: dump
    source: snap/local
    organize:
      electron-launch: app/electron-launch
